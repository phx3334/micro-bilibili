# 三个后端微服务（docker 内部网络）
upstream user_svc {
    server user:8081;
}

upstream video_svc {
    server video:8082;
}

upstream interaction_svc {
    server interaction:8083;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 允许上传大文件（视频等），避免 413 "client intended to send too large body"
    client_max_body_size 1g;
    client_body_timeout 1800s;
    client_body_buffer_size 16m;


    # 前端为 SPA，未匹配到静态资源时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 用户服务：登录/注册/资料/主页/关注粉丝
    location /api/v1/user/ {
        proxy_pass http://user_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
    }

    # 视频服务：列表/详情/上传/转码状态
    location /api/v1/video/ {
        proxy_pass http://video_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传超时（1GB 慢速上行需 30 分钟余量）
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
    }

    # 互动服务：点赞/收藏/评论/观看历史
    location /api/v1/interaction/ {
        proxy_pass http://interaction_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
    }
}
